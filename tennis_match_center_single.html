<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#123b32">
  <title>테니스 복식 매치센터</title>
  <style>
    :root{--bg:#f4f7f5;--card:#fff;--ink:#17221e;--muted:#64716c;--line:#dce5e1;--brand:#176b55;--brand2:#e8f5ef;--danger:#b83b3b;--shadow:0 8px 28px #173d3020}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    header{background:linear-gradient(135deg,#103d32,#19745b);color:#fff;padding:calc(20px + env(safe-area-inset-top)) 18px 20px}header .inner,main{max-width:1100px;margin:auto}h1{font-size:25px;margin:0 0 4px}.sub{opacity:.78;font-size:13px}
    nav{display:flex;gap:8px;overflow:auto;padding:12px 0 2px;scrollbar-width:none}nav button{white-space:nowrap;border:1px solid #ffffff42;background:#ffffff14;color:#fff;border-radius:999px;padding:8px 13px}nav button.active{background:#fff;color:#164c3d}
    main{padding:18px 14px 50px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:1fr 1fr}.grid.three{grid-template-columns:repeat(3,1fr)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.card h2{font-size:17px;margin:0 0 14px}.stat{padding:17px}.stat b{display:block;font-size:26px;color:var(--brand)}.stat span{color:var(--muted);font-size:13px}
    label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field{min-width:0}input,select{width:100%;border:1px solid #cfdad5;border-radius:10px;background:#fff;color:var(--ink);padding:10px 11px;min-height:42px}input:focus,select:focus{outline:2px solid #78bea9;border-color:transparent}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.score{display:flex;gap:8px;align-items:end}.score .field{flex:1}
    .actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--brand);color:white;font-weight:700}.btn.secondary{background:var(--brand2);color:var(--brand)}.btn.ghost{background:#eef1f0;color:#34423d}.btn.danger{background:#fdeaea;color:var(--danger)}.tiny{padding:6px 9px;font-size:12px}
    .notice{background:#eff8f4;border:1px solid #cee9dd;color:#225b49;border-radius:11px;padding:10px 12px;margin-bottom:14px;font-size:13px}.muted{color:var(--muted)}.empty{text-align:center;padding:28px 10px;color:var(--muted)}
    .table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:630px}th,td{padding:10px 9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}th{color:var(--muted);font-size:12px;background:#fafcfb;position:sticky;top:0}td:first-child,th:first-child{text-align:left}.win{color:#137354;font-weight:700}.loss{color:#b13c3c}.pill{display:inline-block;border-radius:999px;padding:3px 8px;font-size:11px;background:var(--brand2);color:var(--brand)}
    .team-box{border:1px solid var(--line);border-radius:13px;padding:14px;background:#fafcfb}.team-box strong{color:var(--brand)}.vs{text-align:center;font-weight:900;color:var(--muted);padding:8px}.bar{height:11px;background:#e5ebe8;border-radius:99px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#34a17f,#176b55);border-radius:99px}
    dialog{border:0;border-radius:18px;padding:0;max-width:580px;width:calc(100% - 28px);box-shadow:0 20px 80px #0005}dialog::backdrop{background:#0007}.dialog-body{padding:20px}.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:#152d26;color:#fff;padding:11px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.2s;z-index:9}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:760px){.grid.two,.grid.three{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}.card{padding:14px}header{padding-left:14px;padding-right:14px}h1{font-size:21px}.hide-mobile{display:none}}
    @media(max-width:420px){.form-grid{grid-template-columns:1fr}.score{grid-column:1}.stat-grid{grid-template-columns:1fr 1fr!important}.stat b{font-size:22px}}
  </style>
</head>
<body>
<header><div class="inner"><h1>🎾 테니스 복식 매치센터</h1><div class="sub">경기 기록부터 랭킹·조합 분석·승부 예측까지</div><nav id="nav"><button class="active" data-page="home">대시보드</button><button data-page="matches">경기 관리</button><button data-page="ranking">선수 순위</button><button data-page="partners">파트너</button><button data-page="h2h">상대전적</button><button data-page="tools">예측·팀 편성</button><button data-page="backup">백업</button></nav></div></header>
<main>
  <section id="home" class="page active">
    <div id="storageNotice" class="notice"></div>
    <div class="grid three stat-grid" id="summary"></div>
    <div class="grid two" style="margin-top:14px"><div class="card"><h2>최근 경기</h2><div id="recent"></div></div><div class="card"><h2>폼이 좋은 선수</h2><div id="formPlayers"></div></div></div>
  </section>
  <section id="matches" class="page">
    <div class="card"><h2 id="formTitle">새 경기 기록</h2><form id="matchForm"><input type="hidden" id="editId"><div class="form-grid"><div class="field"><label>날짜</label><input type="date" id="date" required></div><div class="field"><label>팀 A 선수 1</label><input id="a1" list="players" required placeholder="선수명"></div><div class="field"><label>팀 A 선수 2</label><input id="a2" list="players" required placeholder="선수명"></div><div class="field"><label>팀 B 선수 1</label><input id="b1" list="players" required placeholder="선수명"></div><div class="field"><label>팀 B 선수 2</label><input id="b2" list="players" required placeholder="선수명"></div><div class="score"><div class="field"><label>팀 A 점수</label><input type="number" id="sa" min="0" max="99" required></div><div class="field"><label>팀 B 점수</label><input type="number" id="sb" min="0" max="99" required></div></div><div class="field"><label>메모</label><input id="memo" maxlength="80" placeholder="선택 사항"></div></div><div class="actions"><button class="btn" type="submit">경기 저장</button><button class="btn ghost" type="button" id="cancelEdit" hidden>수정 취소</button></div></form></div>
    <div class="card" style="margin-top:14px"><div class="actions" style="margin-top:0;justify-content:space-between"><h2 style="margin:0">경기 기록</h2><div style="display:flex;gap:7px"><input type="date" id="filterDate" aria-label="날짜 필터"><button class="btn ghost tiny" id="clearFilter">전체</button></div></div><div id="matchList" class="table-wrap" style="margin-top:12px"></div></div>
  </section>
  <section id="ranking" class="page"><div class="card"><div class="actions" style="margin-top:0;justify-content:space-between"><h2 style="margin:0">선수 순위</h2><div class="field" style="width:145px"><label>최소 경기수</label><input type="number" id="minGames" value="1" min="1"></div></div><div id="rankingTable" class="table-wrap"></div></div></section>
  <section id="partners" class="page"><div class="card"><h2>파트너 조합 통계</h2><div id="partnerTable" class="table-wrap"></div></div></section>
  <section id="h2h" class="page"><div class="card"><h2>조합 간 상대전적</h2><div class="grid two"><div class="field"><label>팀 A 조합</label><select id="h2a"></select></div><div class="field"><label>팀 B 조합</label><select id="h2b"></select></div></div><div id="h2result" style="margin-top:16px"></div></div></section>
  <section id="tools" class="page"><div class="grid two"><div class="card"><h2>승부 예측</h2><div class="form-grid" style="grid-template-columns:1fr 1fr"><div class="field"><label>팀 A 선수 1</label><select class="playerSelect" id="pa1"></select></div><div class="field"><label>팀 A 선수 2</label><select class="playerSelect" id="pa2"></select></div><div class="field"><label>팀 B 선수 1</label><select class="playerSelect" id="pb1"></select></div><div class="field"><label>팀 B 선수 2</label><select class="playerSelect" id="pb2"></select></div></div><button class="btn" id="predict" style="margin-top:14px">예측하기</button><div id="prediction" style="margin-top:16px"></div></div><div class="card"><h2>4명 균형 팀 편성</h2><p class="muted">선수 4명을 고르면 기록 기반으로 가장 균형 잡힌 조합을 찾습니다.</p><div class="form-grid" style="grid-template-columns:1fr 1fr"><select class="playerSelect balance"></select><select class="playerSelect balance"></select><select class="playerSelect balance"></select><select class="playerSelect balance"></select></div><button class="btn" id="balance" style="margin-top:14px">팀 만들기</button><div id="balanceResult" style="margin-top:16px"></div></div></div></section>
  <section id="backup" class="page"><div class="grid two"><div class="card"><h2>내보내기</h2><p class="muted">기록을 파일로 보관하거나 다른 기기로 옮길 수 있습니다.</p><div class="actions"><button class="btn" id="exportJson">JSON 백업</button><button class="btn secondary" id="exportCsv">CSV 내보내기</button></div></div><div class="card"><h2>가져오기</h2><p class="muted">이 앱에서 만든 JSON 백업 파일을 불러옵니다. 기존 기록과 합치거나 교체할 수 있습니다.</p><input type="file" id="importFile" accept="application/json,.json"><div class="actions"><button class="btn" id="mergeImport">기록 합치기</button><button class="btn danger" id="replaceImport">기존 기록 교체</button></div></div></div><div class="card" style="margin-top:14px"><h2>데이터 관리</h2><p class="muted">현재 브라우저에 저장된 모든 경기 기록을 삭제합니다.</p><button class="btn danger" id="deleteAll">전체 기록 삭제</button></div></section>
</main>
<datalist id="players"></datalist><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';
  const KEY='tennis-match-center-single-v1';let matches=[];let persistent=true;
  const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const today=()=>new Date().toISOString().slice(0,10);
  function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2200)}
  function load(){try{const raw=localStorage.getItem(KEY);matches=raw?JSON.parse(raw):[];if(!Array.isArray(matches))matches=[];localStorage.setItem(KEY,JSON.stringify(matches))}catch(e){persistent=false;matches=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(matches))}catch(e){persistent=false;toast('브라우저 저장소를 사용할 수 없어 이번 화면에서만 유지됩니다.')}renderAll()}
  function valid(m){return m&&m.id&&/^\d{4}-\d{2}-\d{2}$/.test(m.date)&&Array.isArray(m.a)&&Array.isArray(m.b)&&m.a.length===2&&m.b.length===2&&m.a.concat(m.b).every(x=>typeof x==='string'&&x.trim())&&Number.isFinite(+m.sa)&&Number.isFinite(+m.sb)&&+m.sa!==+m.sb}
  const players=()=>[...new Set(matches.flatMap(m=>m.a.concat(m.b)))].sort((a,b)=>a.localeCompare(b,'ko'));
  const teamKey=t=>[...t].sort((a,b)=>a.localeCompare(b,'ko')).join(' · ');
  function stats(){const out={};players().forEach(n=>out[n]={name:n,g:0,w:0,l:0,pf:0,pa:0,elo:1000,streak:0,recent:[]});[...matches].sort((x,y)=>x.date.localeCompare(y.date)).forEach(m=>{const aw=+m.sa>+m.sb;[m.a,m.b].forEach((team,side)=>team.forEach(n=>{const s=out[n],win=side===0?aw:!aw;s.g++;win?s.w++:s.l++;s.pf+=side===0?+m.sa:+m.sb;s.pa+=side===0?+m.sb:+m.sa;s.streak=win?Math.max(1,s.streak+1):Math.min(-1,s.streak-1);s.recent.push(win?1:0)}));const ea=m.a.reduce((z,n)=>z+out[n].elo,0)/2,eb=m.b.reduce((z,n)=>z+out[n].elo,0)/2,ex=1/(1+Math.pow(10,(eb-ea)/400)),delta=24*((aw?1:0)-ex);m.a.forEach(n=>out[n].elo+=delta);m.b.forEach(n=>out[n].elo-=delta)});return out}
  function combos(){const o={};matches.forEach(m=>{const aw=+m.sa>+m.sb;[[m.a,aw,+m.sa,+m.sb],[m.b,!aw,+m.sb,+m.sa]].forEach(([t,w,pf,pa])=>{const k=teamKey(t),x=o[k]??={name:k,team:[...t],g:0,w:0,l:0,pf:0,pa:0};x.g++;w?x.w++:x.l++;x.pf+=pf;x.pa+=pa})});return o}
  function fmtPct(w,g){return g?Math.round(w/g*100)+'%':'-'}
  function renderAll(){renderHome();renderMatches();renderRanking();renderPartners();fillSelectors();renderH2H();$('#storageNotice').innerHTML=persistent?'✅ 기록은 이 브라우저의 기기 내 저장소에 자동 저장됩니다. 정기적으로 JSON 백업을 권장합니다.':'⚠️ 현재 열기 방식에서는 영구 저장이 제한됩니다. Safari/Chrome의 일반 탭에서 열거나 JSON으로 백업하세요.'}
  function renderHome(){const s=stats(),arr=Object.values(s),total=matches.length;$('#summary').innerHTML=`<div class="card stat"><span>총 경기</span><b>${total}</b></div><div class="card stat"><span>등록 선수</span><b>${arr.length}</b></div><div class="card stat"><span>최근 경기일</span><b style="font-size:19px">${total?[...matches].sort((a,b)=>b.date.localeCompare(a.date))[0].date:'-'}</b></div>`;const rec=[...matches].sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id))).slice(0,5);$('#recent').innerHTML=rec.length?rec.map(m=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)"><small class="muted">${m.date}</small><br><b class="${m.sa>m.sb?'win':''}">${esc(teamKey(m.a))}</b> ${m.sa} : ${m.sb} <b class="${m.sb>m.sa?'win':''}">${esc(teamKey(m.b))}</b></div>`).join(''):'<div class="empty">아직 기록이 없습니다.</div>';arr.sort((a,b)=>(b.recent.slice(-5).reduce((x,y)=>x+y,0)/Math.min(5,b.recent.length)||0)-(a.recent.slice(-5).reduce((x,y)=>x+y,0)/Math.min(5,a.recent.length)||0));$('#formPlayers').innerHTML=arr.length?arr.slice(0,5).map((x,i)=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)"><span>${i+1}. <b>${esc(x.name)}</b></span><span class="pill">최근 ${Math.min(5,x.recent.length)}경기 ${x.recent.slice(-5).reduce((a,b)=>a+b,0)}승</span></div>`).join(''):'<div class="empty">경기를 입력하면 표시됩니다.</div>'}
  function renderMatches(){const f=$('#filterDate').value;let list=[...matches].filter(m=>!f||m.date===f).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));$('#matchList').innerHTML=list.length?`<table><thead><tr><th>날짜</th><th>팀 A</th><th>점수</th><th>팀 B</th><th>메모</th><th>관리</th></tr></thead><tbody>${list.map(m=>`<tr><td>${m.date}</td><td class="${m.sa>m.sb?'win':'loss'}">${esc(teamKey(m.a))}</td><td><b>${m.sa} : ${m.sb}</b></td><td class="${m.sb>m.sa?'win':'loss'}">${esc(teamKey(m.b))}</td><td>${esc(m.memo||'-')}</td><td><button class="btn ghost tiny edit" data-id="${m.id}">수정</button> <button class="btn danger tiny del" data-id="${m.id}">삭제</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">해당 경기 기록이 없습니다.</div>'}
  function renderRanking(){const min=Math.max(1,+$('#minGames').value||1),arr=Object.values(stats()).filter(x=>x.g>=min).sort((a,b)=>((b.w*3+b.l)-(a.w*3+a.l))||(b.w/b.g-a.w/a.g)||(b.w-a.w)||((b.pf-b.pa)-(a.pf-a.pa))||(b.elo-a.elo));$('#rankingTable').innerHTML=arr.length?`<table><thead><tr><th>순위 / 선수</th><th>포인트</th><th>경기</th><th>승</th><th>패</th><th>승률</th><th>득실차</th><th>ELO</th><th>연속</th></tr></thead><tbody>${arr.map((x,i)=>`<tr><td>${i+1}. <b>${esc(x.name)}</b></td><td><b>${x.w*3+x.l}</b></td><td>${x.g}</td><td class="win">${x.w}</td><td>${x.l}</td><td>${fmtPct(x.w,x.g)}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td><td>${Math.round(x.elo)}</td><td>${x.streak>0?x.streak+'연승':x.streak<0?Math.abs(x.streak)+'연패':'-'}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">조건에 맞는 선수가 없습니다.</div>'}
  function renderPartners(){const arr=Object.values(combos()).sort((a,b)=>(b.w/b.g-a.w/a.g)||b.g-a.g);$('#partnerTable').innerHTML=arr.length?`<table><thead><tr><th>조합</th><th>경기</th><th>승</th><th>패</th><th>승률</th><th>득실차</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td>${x.g}</td><td class="win">${x.w}</td><td>${x.l}</td><td>${fmtPct(x.w,x.g)}</td><td>${x.pf-x.pa>0?'+':''}${x.pf-x.pa}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">경기를 입력하면 조합 통계가 표시됩니다.</div>'}
  function fillSelectors(){const ps=players(),opts='<option value="">선택</option>'+ps.map(p=>`<option value="${esc(p)}">${esc(p)}</option>`).join('');$('#players').innerHTML=ps.map(p=>`<option value="${esc(p)}">`).join('');$$('.playerSelect').forEach(el=>{const v=el.value;el.innerHTML=opts;el.value=v});const cs=Object.values(combos()),copts='<option value="">조합 선택</option>'+cs.map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');['#h2a','#h2b'].forEach(q=>{const el=$(q),v=el.value;el.innerHTML=copts;el.value=v})}
  function renderH2H(){const a=$('#h2a').value,b=$('#h2b').value;if(!a||!b||a===b){$('#h2result').innerHTML='<div class="empty">서로 다른 두 조합을 선택하세요.</div>';return}let ag=0,aw=0,bw=0,pfa=0,pfb=0;matches.forEach(m=>{const x=teamKey(m.a),y=teamKey(m.b);if((x===a&&y===b)||(x===b&&y===a)){ag++;const aLeft=x===a,as=aLeft?+m.sa:+m.sb,bs=aLeft?+m.sb:+m.sa;pfa+=as;pfb+=bs;as>bs?aw++:bw++}});$('#h2result').innerHTML=ag?`<div class="team-box" style="text-align:center"><b>${esc(a)}</b><h2 style="font-size:28px;margin:8px">${aw} : ${bw}</h2><b>${esc(b)}</b><p class="muted">${ag}경기 · 총 득점 ${pfa} : ${pfb}</p></div>`:'<div class="empty">두 조합이 맞붙은 기록이 없습니다.</div>'}
  function rating(team){const s=stats();return team.reduce((z,n)=>z+(s[n]?.elo||1000),0)/2}
  function predict(){const a=[$('#pa1').value,$('#pa2').value],b=[$('#pb1').value,$('#pb2').value];if(a.concat(b).some(x=>!x)||new Set(a.concat(b)).size<4)return toast('서로 다른 선수 4명을 선택하세요.');const ra=rating(a),rb=rating(b),p=1/(1+Math.pow(10,(rb-ra)/400)),ap=Math.round(p*100);$('#prediction').innerHTML=`<div class="team-box"><div style="display:flex;justify-content:space-between"><b>${esc(teamKey(a))} ${ap}%</b><b>${100-ap}% ${esc(teamKey(b))}</b></div><div class="bar"><i style="width:${ap}%"></i></div><p class="muted">ELO 기록 기준 예상입니다. 실제 결과를 보장하지 않습니다.</p></div>`}
  function balance(){const p=$$('.balance').map(x=>x.value);if(p.some(x=>!x)||new Set(p).size<4)return toast('서로 다른 선수 4명을 선택하세요.');const pairings=[[[p[0],p[1]],[p[2],p[3]]],[[p[0],p[2]],[p[1],p[3]]],[[p[0],p[3]],[p[1],p[2]]]],best=pairings.sort((x,y)=>Math.abs(rating(x[0])-rating(x[1]))-Math.abs(rating(y[0])-rating(y[1])))[0],chance=Math.round(100/(1+Math.pow(10,(rating(best[1])-rating(best[0]))/400)));$('#balanceResult').innerHTML=`<div class="team-box"><strong>팀 A</strong><h3>${esc(teamKey(best[0]))}</h3><div class="vs">VS · 예상 ${chance}% : ${100-chance}%</div><strong>팀 B</strong><h3>${esc(teamKey(best[1]))}</h3></div>`}
  function download(name,text,type){const blob=new Blob(['\ufeff'+text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
  function readImport(mode){const file=$('#importFile').files[0];if(!file)return toast('JSON 파일을 선택하세요.');const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result),arr=Array.isArray(data)?data:data.matches;if(!Array.isArray(arr))throw 0;const clean=arr.map(m=>({...m,id:String(m.id||uid()),sa:+m.sa,sb:+m.sb,a:m.a.map(x=>String(x).trim()),b:m.b.map(x=>String(x).trim())})).filter(valid);if(!clean.length&&arr.length)throw 0;if(mode==='replace'&&!confirm(`기존 ${matches.length}경기를 교체할까요?`))return;const map=new Map((mode==='merge'?matches:[]).concat(clean).map(m=>[m.id,m]));matches=[...map.values()];save();toast(`${clean.length}개 기록을 불러왔습니다.`)}catch(e){toast('올바른 백업 파일이 아닙니다.')}};r.readAsText(file)}
  $('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;$$('#nav button').forEach(x=>x.classList.toggle('active',x===b));$$('.page').forEach(x=>x.classList.toggle('active',x.id===b.dataset.page));renderAll()});
  $('#matchForm').addEventListener('submit',e=>{e.preventDefault();const a=[$('#a1').value.trim(),$('#a2').value.trim()],b=[$('#b1').value.trim(),$('#b2').value.trim()],sa=+$('#sa').value,sb=+$('#sb').value;if(new Set(a.concat(b).map(x=>x.toLocaleLowerCase())).size<4)return toast('한 경기에는 서로 다른 선수 4명이 필요합니다.');if(sa===sb)return toast('테니스 경기는 무승부로 저장할 수 없습니다.');const id=$('#editId').value||uid(),m={id,date:$('#date').value,a,b,sa,sb,memo:$('#memo').value.trim(),updatedAt:new Date().toISOString()};const idx=matches.findIndex(x=>x.id===id);idx<0?matches.push(m):matches.splice(idx,1,m);save();resetForm();toast(idx<0?'경기를 저장했습니다.':'경기를 수정했습니다.')});
  function resetForm(){$('#matchForm').reset();$('#date').value=today();$('#editId').value='';$('#formTitle').textContent='새 경기 기록';$('#cancelEdit').hidden=true}
  $('#matchList').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(!b)return;const i=matches.findIndex(x=>x.id===b.dataset.id),m=matches[i];if(b.classList.contains('del')){if(confirm('이 경기 기록을 삭제할까요?')){matches.splice(i,1);save();toast('삭제했습니다.')}}else{[['#date',m.date],['#a1',m.a[0]],['#a2',m.a[1]],['#b1',m.b[0]],['#b2',m.b[1]],['#sa',m.sa],['#sb',m.sb],['#memo',m.memo||''],['#editId',m.id]].forEach(([q,v])=>$(q).value=v);$('#formTitle').textContent='경기 수정';$('#cancelEdit').hidden=false;scrollTo({top:document.querySelector('#matches').offsetTop,behavior:'smooth'})}});
  $('#cancelEdit').onclick=resetForm;$('#filterDate').onchange=renderMatches;$('#clearFilter').onclick=()=>{$('#filterDate').value='';renderMatches()};$('#minGames').oninput=renderRanking;$('#h2a').onchange=$('#h2b').onchange=renderH2H;$('#predict').onclick=predict;$('#balance').onclick=balance;
  $('#exportJson').onclick=()=>download(`tennis_backup_${today()}.json`,JSON.stringify({app:'Tennis Match Center',version:1,exportedAt:new Date().toISOString(),matches},null,2),'application/json');
  $('#exportCsv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['날짜','팀A선수1','팀A선수2','팀A점수','팀B점수','팀B선수1','팀B선수2','메모'],...matches.map(m=>[m.date,...m.a,m.sa,m.sb,...m.b,m.memo||''])];download(`tennis_matches_${today()}.csv`,rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv')};
  $('#mergeImport').onclick=()=>readImport('merge');$('#replaceImport').onclick=()=>readImport('replace');$('#deleteAll').onclick=()=>{if(matches.length&&confirm(`모든 경기 ${matches.length}개를 삭제할까요? 이 작업은 되돌릴 수 없습니다.`)){matches=[];save();toast('전체 기록을 삭제했습니다.')}};
  load();resetForm();renderAll();
})();
</script>
</body>
